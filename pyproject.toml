[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dspy-prompt-optimizer"
version = "0.5.0"
description = "Automated prompt optimization for Claude Code skills and agents using DSPy-inspired algorithms"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Ashita Orbis" },
]
keywords = ["dspy", "prompt-engineering", "claude", "optimization", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/AshitaOrbis/dspy-prompt-optimizer"
Repository = "https://github.com/AshitaOrbis/dspy-prompt-optimizer"

[tool.hatch.build.targets.wheel]
packages = ["lib/prompt_optimizer"]
